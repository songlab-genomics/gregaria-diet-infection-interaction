<script id="count-definition-navigation">
(function ($) {
  "use strict";

  $(function () {
    $(".dropdown-submenu > a").on("click.countDefinition", function (event) {
      var item = $(this).parent(".dropdown-submenu");

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      item.siblings(".dropdown-submenu.open").removeClass("open")
        .children("a").attr("aria-expanded", "false");
      item.toggleClass("open");
      $(this).attr("aria-expanded", item.hasClass("open") ? "true" : "false");
      return false;
    });
  });

  $(document).on("hide.bs.dropdown", ".navbar-nav > .dropdown", function () {
    $(this).find(".dropdown-submenu.open").removeClass("open")
      .children("a").attr("aria-expanded", "false");
  });
}(window.jQuery));
</script>
